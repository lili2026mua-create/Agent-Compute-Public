# ⛔ تصمیمِ قطعیِ کاربر ۱۴۰۵-۰۵-۱۷ — مرزِ تازهٔ گامِ ۲/۳ (قفل: analysis-lives-in-step3):
#   produced_by: video-interpreter   ⇒ استخراج (گامِ ۲) — رونویسی، زیرنویس، فریم، تلفیق، متنِ روی‌صفحه، مدیا.
#   produced_by: mapping-specialist  ⇒ تحلیل و قضاوت (گامِ ۳) — راستی‌آزمایی، خلأ، منابع، جنس، نگاشت، نمره.
# گیتِ interpretation_contract.py فقط آیتم‌های video-interpreter را می‌سنجد، پس این تفکیک
# خودبه‌خود برچسبِ «تحلیل‌شده» را به «استخراج کامل شد» تبدیل می‌کند — بی‌نیاز به تغییرِ منطقِ اسکریپت.

# قراردادِ خروجیِ تفسیر — منبعِ یگانه‌ی «چه داده‌ای تولید و چه چیزی نمایش داده می‌شود».
#
# چرا هست (درسِ ۱۴۰۵-۰۵-۰۸): تا امروز «فهرستِ خروجی» دو کپیِ نثریِ موازی داشت — یکی در گامِ ۰ی
# mapping-specialist و یکی در «رکوردِ وضعیت»ِ video-interpreter — که مستقل دریفت می‌کردند. حالا یک فایل
# صاحبِ این فهرست است و هر دو ایجنت آن را می‌خوانند:
#   • video-interpreter (ایجنتِ قبلی = تولیدکننده): هر آیتمِ produced_by=video-interpreter را برای
#     هر بسته **خودکار و بی‌سؤال از کاربر** می‌سازد. «بررسیِ کامل» ذاتیِ همین ایجنت است.
#   • mapping-specialist (نمایش‌گر): هر آیتم را فقط می‌خواند و در report_section مربوطه رندر می‌کند.
#     ⛔ هیچ تحلیل/رونویسی/OCR/تلفیق/جستجویی نمی‌کند؛ فقط داده‌ی آماده را نمایش می‌دهد.
#
# افزودنِ یک خروجیِ تازه = فقط یک آیتمِ جدید این‌جا. از همان لحظه video-interpreter موظف است آن را
# برای **تمام ویدیوهای بعدی** بسازد، و mapping-specialist آن را در جای تعیین‌شده رندر می‌کند. بی‌ویرایشِ
# کدِ هیچ‌کدام از دو ایجنت.
#
# گاردِ ماشین‌خوان: Sys.registry/invariants.json → interpretation-output-contract-shared
# چکِ بسته بر مبنای همین فایل: Sys.scripts/interpretation_contract.py --check <پوشهٔ interpretation>
version: 1

# required_for: both = هم پیش‌نمایش هم نهایی | final = فقط گزارشِ نهایی | render = نمایش‌گر خودش می‌سازد
items:
  - key: file_id
    file: interpretation/enrichment.json        # زبان/زیرنویس‌دارد/نوع؛ + خوانشِ بصریِ فریم توسطِ تولیدکننده
    produced_by: video-interpreter
    report_section: "۱ — شناساییِ فایل"
    required_for: both
    render: "۵ اسکرین‌شات + زبان + زیرنویس(دارد/ندارد) + موضوع در یک جمله"

  - key: transcript
    file: interpretation/transcript.json
    produced_by: video-interpreter              # گامِ ۱ — رونویسیِ صوت (روی Actions)
    report_section: "۲ (ستونِ روایت) + ۵ (روش)"
    required_for: both
    render: "ستونِ روایتِ جدولِ سه‌ستونه"

  - key: onscreen_text
    file: interpretation/onscreen-text.json
    produced_by: video-interpreter              # گامِ ۲-ب — متنِ روی‌صفحه پس از گاردِ کیفیت
    report_section: "۲ (ستونِ روی‌صفحه) + ۳ (شناساییِ نامِ ابزارها)"
    required_for: final
    render: "ستونِ روی‌صفحه؛ هر ردیف با برچسبِ منبع: خوانشِ بصری | OCR | ندارد"
    truth_source: >-
      منبعِ حقیقتِ متنِ روی‌صفحه **خوانشِ بصری** است، نه OCR. OCR فقط سرنخ است. وقتی
      ocr_quality برابرِ «مخدوش» باشد، این آیتم از روی interpretation/subtitle-strips/
      با خوانشِ بصری ساخته می‌شود. ⛔ نامِ محصول/ابزار هرگز از روی گفتارِ رونویسی‌شده حدس
      زده نمی‌شود — فقط از متنِ روی‌صفحه یا WebSearchِ تأییدشده.

  - key: fusion
    file: interpretation/fusion.json
    produced_by: video-interpreter              # گامِ ۳ — تلفیقِ صوت+زیرنویس+خوانشِ بصری روی محورِ زمان
    report_section: "۲ — جدولِ سه‌ستونهٔ تلفیقی"
    required_for: final
    render: "جدولِ زمان | روایت | روی‌صفحه"

  - key: raw_claims_and_sources
    file: interpretation/fusion.json            # دو آرایه درونِ همان فایل: claims[] و mentioned_sources[]
    produced_by: video-interpreter              # استخراجِ بی‌قضاوت (گامِ ۲)
    report_section: "(بی‌بخشِ مستقل — ورودیِ الف-۱ و الف-۳ی گامِ ۳)"
    required_for: final
    render: "چاپ نمی‌شود؛ خوراکِ فازِ الف است"
    structure: >-
      claims[]: هر جملهٔ بررسی‌پذیرِ محتوا، عیناً و بدونِ حکم — {متن, زمان, منبع, نوع: بررسی‌پذیر|بررسی‌ناپذیر}.
      mentioned_sources[]: هر نام/آدرس/مخزنی که روی صفحه دیده شده — {نام, آدرسِ خوانده‌شده, زمان, منبعِ خوانش}؛
      فقط از خوانشِ بصریِ فریم، نه OCRِ مشکوک و نه رونوشتِ مخدوش.
      ⛔ گامِ ۲ حق حکم‌دادن ندارد (قفل: analysis-lives-in-step3)؛ این سیاههٔ خام است نه قضاوت.
      ⛔ آرایهٔ خالی مجاز است، آرایهٔ غایب نه — بی claims[] پنلِ گامِ ۳ چیزی برای رأی‌دادن ندارد.

  - key: verified_points
    file: interpretation/verified-points.json    # شاملِ فیلدِ paid_review برای هر نکته
    produced_by: mapping-specialist              # الف-۱ — راستی‌آزماییِ ادعاها با WebSearch (تحلیل، نه استخراج)
    report_section: "۳ — ادعاها و صحت"
    required_for: final
    render: "جدولِ ادعا | حکم | شواهد و روشِ استخراج"

  - key: content_gaps
    file: interpretation/content-gaps.json
    produced_by: mapping-specialist              # الف-۲ — خلأهای محتوا (تحلیل)
    report_section: "۳-ب — خلأهای محتوا"
    required_for: final
    render: "جدولِ خلأ | منبعِ بیرونی (هر ردیف با برچسبِ دانشِ بیرونی)"

  - key: genre_classification
    file: interpretation/genre-classification.json
    produced_by: mapping-specialist              # الف-۴ — تشخیصِ جنس، پنج جنس (تحلیل)
    report_section: "۴ — نگاشت (جنس→ایجنت)"
    required_for: final
    render: "جدولِ دانش | جنس(متد/پروسیجر/پرامپت/اسکیل) | ایجنت/مقصد | نمرهٔ اثرگذاری (۱–۱۰)"
    scoring: >-
      ⛔ ستونِ چهارم **نمرهٔ اثرگذاری (۱ تا ۱۰)** است و **اجباری** است — هیچ ردیفی بدونِ نمره
      چاپ نمی‌شود. نویسندهٔ نمره **دستیارِ دوم (سطحِ ۲)** است در زمانِ رندر، نه `video-interpreter`؛
      پس اگر `genre-classification.json` نمره نداشت این «نقصِ تولیدکننده» نیست و نمره همان‌جا زده می‌شود.
      معیار: «اگر این دانش وارد سازمان شود، کارکردِ روزمره چقدر بهتر می‌شود؟» — ترکیبِ اثرگذاری و
      اهمیت، نه تازگی یا جذابیت. مقیاس: ۹–۱۰ دگرگون‌کننده · ۷–۸ بهبودِ محسوس · ۵–۶ مفیدِ حاشیه‌ای ·
      ۳–۴ کم‌اثر · ۱–۲ عملاً بی‌اثر. کنارِ عدد **یک عبارتِ کوتاهِ دلیل** بیاید تا نمره قابلِ بازبینی باشد.
      ردیف‌های بخشِ ۸ (پیشنهادهای سطحِ ۲) به ترتیبِ **نزولیِ همین نمره** مرتب می‌شوند و آستانهٔ
      «ارزشِ بررسی‌دار» نمرهٔ **۶ به بالا** است؛ زیرِ ۶ صریح کنار گذاشته می‌شود با یک‌خط دلیل.
      ⛔ آستانهٔ ۶ **شرطِ ورود** است نه برچسب: ردیفِ زیرِ ۶ به گامِ ثبتِ رکورد نمی‌رود — نه اسکیلِ
      تازه، نه ویرایشِ سندِ موجود. تنها استثنا: به‌روزرسانیِ رکوردِ **موجود** که هیچ بایتی به بلوکِ
      DIGEST اضافه نکند. قفل: mapping-score-is-entry-gate.

  - key: media
    file: "interpretation/frames/ + interpretation/index.html (+ mp4)"
    produced_by: video-interpreter              # گامِ ۷ — فریم‌ها + صفحهٔ نمایشِ تک‌منظوره
    report_section: "۶ — نمایشِ عکس‌ها و ویدیوها"
    required_for: both
    render: >-
      روترِ نمایش (تصمیمِ کاربر ۱۴۰۵-۰۵-۱۵): ویدیو دارد ⇒ `index.html`ِ تک‌منظورهٔ همان بسته که
      **هیچ چیزی جز ویدیو(ها)** ندارد؛ تصویر دارد ⇒ تصاویرِ خودِ بسته مستقیم در گزارش با پیش‌نمایش.
      ⛔ فریم‌ها و اسکرین‌شات‌های استخراجیِ دستیار (`frames/`، `subtitle-strips/`) نمایش داده
      نمی‌شوند — ابزارِ کارِ داخلی‌اند نه محتوای بسته. پیش از تحویل، سلامتِ صفحه با
      `Sys.scripts/media_render.py --check` سنجیده می‌شود؛ کدِ غیرصفر یعنی تحویل ممنوع.
      قفل: media-display-is-single-purpose-html

  - key: builder_agents_and_note
    file: "(بدون فایل — نمایش‌گر در زمانِ رندر می‌نویسد)"
    produced_by: mapping-specialist                 # نمایش‌گر در زمانِ رندر می‌نویسد
    report_section: "۷ — ایجنت‌های سازنده + نظرِ سطحِ ۲"
    required_for: both
    render: "فهرستِ ایجنت‌ها + بلوکِ جدای «اوپوس این پیشنهاد را می‌دهد: …»"

  - key: summary_proposals
    file: interpretation/genre-classification.json   # ورودی؛ خروجی را سطحِ ۲ در زمانِ رندر می‌نویسد
    produced_by: mapping-specialist                 # صدای سطحِ ۲ (دستیارِ دوم)، نه داده‌ی تفسیر
    report_section: "۸ — جمع‌بندی (پیشنهادهای سطحِ ۲)"
    required_for: both
    render: >-
      از جدولِ نگاشت فقط مواردِ «ارزشِ بررسی‌دار» را بردار؛ برای هر مورد، دستیارِ دوم در حداکثرِ
      ۴ خط بگوید چگونه می‌توان با آن سازمان را توانمند کرد — در قالبِ پیشنهاد که «یا همان اجرا
      می‌شود یا با هم بحث می‌کنیم». مواردِ بی‌ارزش صریح کنار گذاشته و دلیلش یک‌خطی گفته شود.

  - key: external_sources
    file: interpretation/external-sources.json
    produced_by: mapping-specialist              # الف-۳ — ثبتِ منابعِ مرجع (تحلیل)
    report_section: "۳-ج — منابعِ مرجعِ معرفی‌شده"
    required_for: final
    render: "جدولِ منبع | نوع | چه می‌دهد | وضعیتِ ثبت در Sys.registry/external-sources.yaml"
    structure: >-
      آرایه‌ای از رکوردها، یکی به‌ازای هر مخزن/سایتِ مرجعی که ویدیو معرفی کرده (اگر هیچ‌کدام،
      آرایهٔ خالی و نه حذفِ فایل). هر رکورد: id ، kind (repo | site | topic-list) ، url ،
      domain ، gives (یک جملهٔ فارسی) ، free ، caveat.
      ⛔ آدرس هرگز از رونوشتِ صوت یا OCR ساخته نمی‌شود — یا از خوانشِ بصریِ فریم است یا از
      WebSearchِ راستی‌آزمایی‌شده. آدرسِ حدسی ثبت نمی‌شود.
      پس از ساخت، رکوردهای تازه به Sys.registry/external-sources.yaml اضافه می‌شوند؛ ثبت‌نشدن
      همان شکستِ خاموشی است که این آیتم برای بستنش ساخته شد (قفل: external-sources-are-registered).

  - key: adoption_guide
    file: "(بدون فایل — نمایش‌گر در زمانِ رندر می‌سازد؛ ورودی: بخشِ ۸)"
    produced_by: mapping-specialist                 # صدای سطحِ ۲ (دستیارِ دوم)، نه لایهٔ دادهٔ تفسیر
    report_section: "۹ — این به‌روزرسانی را چگونه استفاده کنم؟"
    required_for: both
    render: "جدولِ چه اضافه شد | کجا نشست (مسیرِ دقیق) | چطور فعال می‌شود | جمله/فرمانِ قابلِ کپی"
    structure: >-
      یک ردیف به‌ازای **هر موردی که در بخشِ ۸ واردِ مخزن شد** (مواردِ کنارگذاشته نمی‌آیند، چون
      چیزی اضافه نشده که استفاده شود). ستونِ «چطور فعال می‌شود» دقیقاً یکی از سه حالت است:
      خودکار (نامِ گارد/هوکی که اجرایش می‌کند گفته شود) | با یک جمله در چت | با یک فرمان/اسکریپت.
      ستونِ آخر باید **قابلِ کپی** باشد؛ توصیفِ کلی مثلِ «می‌توانی ازش استفاده کنی» تخلف است.
      ⛔ اگر لایهٔ تفسیر این را نساخته بود، نمایش‌گر **خودش می‌سازد** — مثلِ ستونِ نمرهٔ بخشِ ۴،
      این هم کارِ دستیارِ دوم در زمانِ رندر است، نه نقصِ تولیدکننده؛ بسته به‌خاطرِ نبودش
      به video-interpreter برنمی‌گردد. قفل: report-has-adoption-guide

  - key: data_inventory
    file: interpretation/data-inventory.json
    produced_by: video-interpreter              # آخرین گام — سیاههٔ آنچه واقعاً تولید شد
    report_section: "۰ — فهرستِ دادهٔ تحلیل‌شده"
    required_for: both
    render: "جدولِ آیتم | فایل | وضعیت | منبعِ حقیقت | پوشش"
    structure: >-
      آرایه‌ای از رکوردها، یکی به‌ازای **هر آیتمِ همین قرارداد** (هیچ‌کدام حذف نمی‌شود، حتی
      اگر غایب باشد). هر رکورد دقیقاً این پنج فیلد را دارد:
        item      — کلیدِ آیتم در همین قرارداد
        file      — مسیرِ فایلِ تولیدشده یا null
        status    — یکی از: ساخته‌شده | ناقص | مخدوش | غایب
        source    — منبعِ حقیقت: خوانشِ بصری | OCR | رونویسیِ صوت | WebSearch | نمونه‌برداریِ ابزاری | استدلالِ دستیار
        coverage  — پوششِ کمّی و قابلِ‌راستی‌آزمایی (مثلاً «۵۱ بازه از ۷۶ ثانیه» یا «۶ ادعا از ۶»)
      ⛔ status هرگز از روی وجودِ فایل تعیین نمی‌شود، بلکه از روی **کیفیتِ محتوا**: فایلی که
      هست ولی محتوایش زباله است «مخدوش» است نه «ساخته‌شده». همین سیاهه چیزی است که در
      گزارش پیش از هر محتوای دیگری چاپ می‌شود تا خواننده بداند به کدام بخش چقدر اعتماد کند.
