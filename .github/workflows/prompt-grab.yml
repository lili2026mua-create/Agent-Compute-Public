# Click the "Copy prompt" button on a design source and capture what it copies.
#
# WHY THIS EXISTS (1405-06-30)
# Some front-design sources ship their payload as a PROMPT, not as page text:
# the visitor picks a design and a button puts the prompt on the clipboard.
# A plain render sees the button and never presses it, so that payload is
# invisible to every text-based harvest. Measured that day: motionsite.ai
# /templates lists 16 named templates each with a "Copy Prompt" button, and
# 21st.dev component pages carry "Copy prompt" next to the code.
#
# HOW
# Headless Chromium has no real clipboard, so instead of reading one we HOOK
# it before the page loads: navigator.clipboard.writeText, the legacy
# document.execCommand('copy') path, and the 'copy' event. Whatever the page
# tries to copy lands in a JS array we read back afterwards.
#
# ⛔ INNERMOST CLICKABLE, NOT EVERY TEXT MATCH (fixed 1405-06-30, run 35612219710)
# Matching by text alone found 69 nodes for 16 buttons - the label span, the
# button around it, and the card around that all contain the same string.
# Clicking an ancestor is not actionable, so clicks 2..16 each burned an 8s
# timeout and only one prompt came back. The page is now asked for the
# innermost real control, deduped by on-screen position, with Escape pressed
# after each click to clear whatever the click opened.
#
# ⛔ DELIVERABLE BEFORE DECORATION (fixed 1405-06-30, run 35610912131)
# The first version took a full-page screenshot AFTER the clicks and BEFORE
# writing prompts.json. On a long animated page that shot timed out at 30s,
# the job died with exit 1, and every captured prompt was lost. The result
# file is now written first; the shot comes last, inside a try, and its
# failure is a note rather than the end of the job.
#
# BOUNDARY - no login wall, no paywall, no challenge is bypassed. This only
# presses a button that is already visible to any ordinary visitor on a public
# page. A prompt that needs an account stays out of reach, by design.
name: prompt-grab
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public page carrying prompt buttons"
        required: true
      button_text:
        description: "Comma-separated button labels to click"
        required: false
        default: "Copy prompt,Copy Prompt,Copy the prompt"
      max_clicks:
        description: "How many buttons to press (cap)"
        required: false
        default: "20"
      scroll:
        description: "Scroll passes before clicking (loads lazy cards)"
        required: false
        default: "2"
permissions:
  contents: read
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Grab
        env:
          U: ${{ inputs.url }}
          LABELS: ${{ inputs.button_text }}
          MAXC: ${{ inputs.max_clicks }}
          SC: ${{ inputs.scroll }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          url    = os.environ["U"].strip()
          labels = [s.strip() for s in os.environ["LABELS"].split(",") if s.strip()]
          maxc   = int(os.environ.get("MAXC", "20"))
          scroll = int(os.environ.get("SC", "2"))

          HOOK = """
          window.__grabbed = [];
          (function () {
            const push = (t) => { if (t && String(t).trim()) window.__grabbed.push(String(t)); };
            try {
              if (navigator.clipboard) {
                const orig = navigator.clipboard.writeText?.bind(navigator.clipboard);
                navigator.clipboard.writeText = function (t) { push(t); return orig ? orig(t) : Promise.resolve(); };
              }
            } catch (e) {}
            try {
              const ec = document.execCommand?.bind(document);
              document.execCommand = function (cmd, ...rest) {
                if (String(cmd).toLowerCase() === 'copy') {
                  const s = window.getSelection?.();
                  if (s) push(s.toString());
                  const a = document.activeElement;
                  if (a && 'value' in a) push(a.value);
                }
                return ec ? ec(cmd, ...rest) : false;
              };
            } catch (e) {}
            document.addEventListener('copy', (e) => {
              try { push(e.clipboardData?.getData('text/plain')); } catch (x) {}
              const s = window.getSelection?.(); if (s) push(s.toString());
            }, true);
          })();
          """

          out = {"url": url, "labels": labels, "items": [], "notes": []}

          def save():
              out["verdict"] = ("ok" if out["items"]
                                else ("no-button" if not out.get("buttons_seen")
                                      else "clicked-but-empty"))
              json.dump(out, open("out/prompts.json", "w", encoding="utf-8"),
                        ensure_ascii=False, indent=1)

          page = b = None
          try:
              with sync_playwright() as pw:
                  b = pw.chromium.launch()
                  ctx = b.new_context(viewport={"width": 1440, "height": 1000})
                  try:
                      ctx.grant_permissions(["clipboard-read", "clipboard-write"])
                  except Exception as e:
                      out["notes"].append(f"permissions: {e}")
                  ctx.add_init_script(HOOK)
                  page = ctx.new_page()

                  # ⛔ LISTEN TO THE NETWORK, NOT ONLY THE CLIPBOARD (1405-06-30)
                  # The payload probe proved the prompt text is NOT in the page:
                  # scripts=32, script hits=0, flight=0, html-has-prompt=False.
                  # So the button fetches it. Recording the response both captures
                  # the text without depending on a clipboard write AND reveals the
                  # address, which is what lets all of them be fetched directly.
                  seen_urls = {}
                  raws = []

                  def _on_response(resp):
                      try:
                          u = resp.url
                          if u.startswith("data:") or resp.request.resource_type in (
                                  "image", "font", "stylesheet", "media"):
                              return
                          body = resp.text()
                      except Exception:
                          return
                      if not body or len(body) < 400:
                          return
                      needles = ("Role & Persona", "award-winning",
                                 "Master Prompt", "Act as an", "You are an")
                      counts = {k: body.count(k) for k in needles if k in body}
                      if counts:
                          seen_urls[u] = len(body)
                          rec = {"url": u, "len": len(body), "counts": counts}
                          # ⛔ Keep a window around the first hit: knowing WHERE the
                          #    text sits in the document is what tells us how to parse
                          #    all of them without pressing a single button.
                          k0 = min(body.index(k) for k in counts)
                          rec["window"] = body[max(0, k0 - 260):k0 + 260]
                          out.setdefault("net", []).append(rec)
                          raws.append((u, body))

                  page.on("response", _on_response)
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  try:
                      page.wait_for_load_state("networkidle", timeout=25000)
                  except Exception:
                      pass
                  for _ in range(scroll):
                      page.mouse.wheel(0, 2400); page.wait_for_timeout(1500)
                  page.wait_for_timeout(1500)

                  # ⛔ LOOK IN THE PAGE DATA BEFORE CLICKING ANYTHING.
                  # Clicking is the fragile path. If the prompts already ship inside
                  # the page payload (Next.js flight data, an inline JSON script),
                  # one read gets all of them and no button has to cooperate.
                  probe = page.evaluate("""() => {
                       const needles = ['Role & Persona', 'award-winning',
                                        'Master Prompt', 'Act as an'];
                       const hits = [];
                       let scripts = 0;
                       for (const s of Array.from(document.querySelectorAll('script'))) {
                         scripts++;
                         const t = s.textContent || '';
                         if (!t) continue;
                         const n = needles.find(x => t.includes(x));
                         if (n) hits.push({where: s.id || s.type || 'inline',
                                           len: t.length, needle: n});
                       }
                       let flight = 0, flightHit = 0;
                       try {
                         const f = self.__next_f || [];
                         flight = f.length;
                         for (const c of f) {
                           const t = Array.isArray(c) ? String(c[1] || '') : String(c || '');
                           if (needles.some(x => t.includes(x))) flightHit++;
                         }
                       } catch (e) {}
                       const html = document.documentElement.innerHTML;
                       return {scripts: scripts, hits: hits, flight: flight,
                               flightHit: flightHit,
                               htmlLen: html.length,
                               htmlHasPrompt: needles.some(x => html.includes(x))};
                     }""")
                  out["payload_probe"] = probe
                  out["notes"].append(
                      f"payload probe: scripts={probe['scripts']} "
                      f"script-hits={len(probe['hits'])} flight={probe['flight']} "
                      f"flight-hits={probe['flightHit']} "
                      f"html-has-prompt={probe['htmlHasPrompt']}")
                  for h in probe["hits"][:5]:
                      out["notes"].append(
                          f"  script hit: {h['where']} · {h['len']} chars · {h['needle']!r}")
                  save()

                  # ⛔ RE-TAG BEFORE EVERY CLICK (fixed 1405-06-30, run 35614763448)
                  # Tagging all targets once and clicking them in a loop fails on a
                  # React page: the first successful copy re-renders the cards, the
                  # tagged nodes are replaced, and every later locator matches nothing
                  # and times out. Evidence: target 0 +1, target 1 +0, targets 2..19
                  # all TimeoutError. So the DOM is re-asked for the i-th target
                  # immediately before each click.
                  FIND = """(args) => {
                       const want = args.labels.map(s => s.toLowerCase());
                       const i = args.i;
                       const all = Array.from(document.querySelectorAll('*'));
                       const cand = [];
                       for (const el of all) {
                         const txt = (el.innerText || el.getAttribute('aria-label') || '')
                                       .trim().toLowerCase();
                         if (!want.some(w => txt.includes(w))) continue;
                         const r = el.getBoundingClientRect();
                         if (r.width < 4 || r.height < 4) continue;
                         cand.push(el);
                       }
                       const inner = cand.filter(
                         el => !cand.some(o => o !== el && el.contains(o)));
                       const seen = new Set(); const uniq = [];
                       for (const el of inner) {
                         const r = el.getBoundingClientRect();
                         const key = Math.round(r.top + window.scrollY) + 'x'
                                   + Math.round(r.left + window.scrollX);
                         if (seen.has(key)) continue;
                         seen.add(key); uniq.push(el);
                       }
                       if (args.count) return {total: uniq.length};
                       const el = uniq[i];
                       if (!el) return null;
                       // the real control is the nearest clickable ANCESTOR, not the span
                       let hit = el;
                       let p = el;
                       for (let d = 0; d < 6 && p; d++, p = p.parentElement) {
                         const tn = p.tagName.toLowerCase();
                         if (tn === 'button' || tn === 'a' ||
                             p.getAttribute('role') === 'button' ||
                             (getComputedStyle(p).cursor === 'pointer')) { hit = p; break; }
                       }
                       let tag = '';
                       p = el;
                       for (let d = 0; d < 8 && p; d++, p = p.parentElement) {
                         const t = (p.innerText || '').trim().split('\\n')
                                     .map(x => x.trim())
                                     .filter(x => x.length > 1 &&
                                             !want.some(w => x.toLowerCase().includes(w)));
                         if (t.length) { tag = t[0].slice(0, 60); break; }
                       }
                       document.querySelectorAll('[data-grab-now]')
                               .forEach(n => n.removeAttribute('data-grab-now'));
                       hit.setAttribute('data-grab-now', '1');
                       return {tag: tag, node: hit.tagName.toLowerCase(),
                               inner: el.tagName.toLowerCase(), total: uniq.length};
                     }"""

                  n_total = page.evaluate(FIND, {"labels": labels, "i": 0,
                                                 "count": True})["total"]
                  out["buttons_seen"] = n_total
                  out["notes"].append(f"innermost targets on page: {n_total}")

                  clicks = 0
                  for idx in range(n_total):
                      if clicks >= maxc: break
                      info = page.evaluate(FIND, {"labels": labels, "i": idx,
                                                  "count": False})
                      if not info:
                          out["notes"].append(f"target {idx}: vanished before the click")
                          continue
                      tag = info["tag"]
                      before = page.evaluate("window.__grabbed.length")
                      el = page.locator('[data-grab-now="1"]')
                      how = "click"
                      try:
                          el.scroll_into_view_if_needed(timeout=4000)
                          try:
                              el.hover(timeout=2000)   # the button may only show on hover
                              page.wait_for_timeout(200)
                          except Exception:
                              pass
                          el.click(timeout=6000)
                      except Exception as e:
                          how = f"force/{type(e).__name__}"
                          try:
                              el.click(timeout=4000, force=True)
                          except Exception as e2:
                              out["notes"].append(
                                  f"target {idx} <{info['node']}> {tag[:24]!r}: "
                                  f"both failed ({type(e).__name__}/{type(e2).__name__})")
                              continue
                      page.wait_for_timeout(700)
                      clicks += 1
                      after = page.evaluate("window.__grabbed")
                      got = len(after) - before
                      if got > 0:
                          for x in after[before:]:
                              out["items"].append({"label": tag, "prompt": x})
                      else:
                          out["notes"].append(
                              f"target {idx} <{info['node']}/{info['inner']}> "
                              f"{tag[:24]!r} via {how}: +0")
                      # ⛔ Save after every capture: a crash on click 12 must not
                      #    throw away the eleven prompts already in hand.
                      out["clicks"] = clicks
                      save()
                  out["clicks"] = clicks
                  out["notes"].append(
                      f"responses carrying prompt text: {len(seen_urls)}")
                  for r in out.get("net", [])[:8]:
                      out["notes"].append(
                          f"  from {r['url'][:100]} ({r['len']} chars) {r['counts']}")
                      out["notes"].append(
                          "  window: " + r["window"].replace("\n", " ")[:420])
                  # ⛔ Keep the raw bodies: they are the real evidence, and a parser
                  #    can be written against them without another run.
                  for i, (u, b) in enumerate(raws[:3]):
                      open(f"out/raw-{i}.txt", "w", encoding="utf-8").write(b)
                  save()

                  # Decoration last, and never fatal.
                  try:
                      page.screenshot(path="out/page.png", full_page=False, timeout=20000)
                  except Exception as e:
                      out["notes"].append(f"screenshot skipped: {type(e).__name__}")
                      save()
                  b.close()
          except Exception as e:
              out["notes"].append(f"fatal: {type(e).__name__}: {e}")
              save()

          save()
          print(f"buttons={out.get('buttons_seen')} clicks={out.get('clicks')} "
                f"captured={len(out['items'])} verdict={out['verdict']}")
          PY
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("out/prompts.json"):
              print("## prompt-grab — no result file"); raise SystemExit
          d = json.load(open("out/prompts.json", encoding="utf-8"))
          print(f"## prompt-grab — `{d['url']}`\n")
          print(f"buttons seen: **{d.get('buttons_seen')}** · clicked: **{d.get('clicks')}** · "
                f"captured: **{len(d['items'])}** · verdict: **{d.get('verdict')}**\n")
          if d["items"]:
              print("| card | prompt (first 120 chars) |")
              print("|---|---|")
              for it in d["items"][:25]:
                  p = it["prompt"].replace("|", "\\|").replace("\n", " ")[:120]
                  print(f"| {it['label'][:40]} | {p} |")
          for n in d.get("notes", [])[:40]:
              print(f"\n- note: {n}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "prompt-grab-${{ github.run_id }}"
          path: out/
          retention-days: 7
