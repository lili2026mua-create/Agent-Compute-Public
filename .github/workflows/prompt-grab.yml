# Click the "Copy prompt" button on a design source and capture what it copies.
#
# WHY THIS EXISTS (1405-06-30)
# Some front-design sources ship their payload as a PROMPT, not as page text:
# the visitor picks a design and a button puts the prompt on the clipboard.
# A plain render sees the button and never presses it, so that payload is
# invisible to every text-based harvest. Measured that day: motionsite.ai
# /templates lists 16 named templates each with a "Copy Prompt" button, and
# 21st.dev component pages carry "Copy prompt" next to the code.
#
# HOW
# Headless Chromium has no real clipboard, so instead of reading one we HOOK
# it before the page loads: navigator.clipboard.writeText, the legacy
# document.execCommand('copy') path, and the 'copy' event. Whatever the page
# tries to copy lands in a JS array we read back afterwards.
#
# ⛔ DELIVERABLE BEFORE DECORATION (fixed 1405-06-30, run 35610912131)
# The first version took a full-page screenshot AFTER the clicks and BEFORE
# writing prompts.json. On a long animated page that shot timed out at 30s,
# the job died with exit 1, and every captured prompt was lost. The result
# file is now written first; the shot comes last, inside a try, and its
# failure is a note rather than the end of the job.
#
# BOUNDARY - no login wall, no paywall, no challenge is bypassed. This only
# presses a button that is already visible to any ordinary visitor on a public
# page. A prompt that needs an account stays out of reach, by design.
name: prompt-grab
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public page carrying prompt buttons"
        required: true
      button_text:
        description: "Comma-separated button labels to click"
        required: false
        default: "Copy prompt,Copy Prompt,Copy the prompt"
      max_clicks:
        description: "How many buttons to press (cap)"
        required: false
        default: "20"
      scroll:
        description: "Scroll passes before clicking (loads lazy cards)"
        required: false
        default: "2"
permissions:
  contents: read
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Grab
        env:
          U: ${{ inputs.url }}
          LABELS: ${{ inputs.button_text }}
          MAXC: ${{ inputs.max_clicks }}
          SC: ${{ inputs.scroll }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          url    = os.environ["U"].strip()
          labels = [s.strip() for s in os.environ["LABELS"].split(",") if s.strip()]
          maxc   = int(os.environ.get("MAXC", "20"))
          scroll = int(os.environ.get("SC", "2"))

          HOOK = """
          window.__grabbed = [];
          (function () {
            const push = (t) => { if (t && String(t).trim()) window.__grabbed.push(String(t)); };
            try {
              if (navigator.clipboard) {
                const orig = navigator.clipboard.writeText?.bind(navigator.clipboard);
                navigator.clipboard.writeText = function (t) { push(t); return orig ? orig(t) : Promise.resolve(); };
              }
            } catch (e) {}
            try {
              const ec = document.execCommand?.bind(document);
              document.execCommand = function (cmd, ...rest) {
                if (String(cmd).toLowerCase() === 'copy') {
                  const s = window.getSelection?.();
                  if (s) push(s.toString());
                  const a = document.activeElement;
                  if (a && 'value' in a) push(a.value);
                }
                return ec ? ec(cmd, ...rest) : false;
              };
            } catch (e) {}
            document.addEventListener('copy', (e) => {
              try { push(e.clipboardData?.getData('text/plain')); } catch (x) {}
              const s = window.getSelection?.(); if (s) push(s.toString());
            }, true);
          })();
          """

          out = {"url": url, "labels": labels, "items": [], "notes": []}

          def save():
              out["verdict"] = ("ok" if out["items"]
                                else ("no-button" if not out.get("buttons_seen")
                                      else "clicked-but-empty"))
              json.dump(out, open("out/prompts.json", "w", encoding="utf-8"),
                        ensure_ascii=False, indent=1)

          page = b = None
          try:
              with sync_playwright() as pw:
                  b = pw.chromium.launch()
                  ctx = b.new_context(viewport={"width": 1440, "height": 1000})
                  try:
                      ctx.grant_permissions(["clipboard-read", "clipboard-write"])
                  except Exception as e:
                      out["notes"].append(f"permissions: {e}")
                  ctx.add_init_script(HOOK)
                  page = ctx.new_page()
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  try:
                      page.wait_for_load_state("networkidle", timeout=25000)
                  except Exception:
                      pass
                  for _ in range(scroll):
                      page.mouse.wheel(0, 2400); page.wait_for_timeout(1500)
                  page.wait_for_timeout(1500)

                  total = 0
                  for lab in labels:
                      n = page.get_by_text(lab, exact=False).count()
                      total += n
                      out["notes"].append(f"label {lab!r}: {n} on page")
                  out["buttons_seen"] = total

                  clicks = 0
                  for lab in labels:
                      if clicks >= maxc: break
                      loc = page.get_by_text(lab, exact=False)
                      n = loc.count()
                      for i in range(n):
                          if clicks >= maxc: break
                          before = page.evaluate("window.__grabbed.length")
                          tag = ""
                          try:
                              tag = loc.nth(i).evaluate(
                                  """el => {
                                       let p = el;
                                       for (let d = 0; d < 6 && p; d++, p = p.parentElement) {
                                         const t = (p.innerText || '').trim().split('\\n')
                                                     .filter(x => x.trim().length > 1);
                                         if (t.length > 1) return t[0].slice(0, 60);
                                       }
                                       return '';
                                     }""")
                          except Exception:
                              pass
                          try:
                              loc.nth(i).scroll_into_view_if_needed(timeout=5000)
                              loc.nth(i).click(timeout=8000)
                              page.wait_for_timeout(900)
                          except Exception as e:
                              out["notes"].append(f"click {i} ({lab}): {type(e).__name__}")
                              continue
                          clicks += 1
                          after = page.evaluate("window.__grabbed")
                          if len(after) > before:
                              for t in after[before:]:
                                  out["items"].append({"label": tag, "prompt": t})
                          # ⛔ Save after every capture: a crash on click 12 must not
                          #    throw away the eleven prompts already in hand.
                          out["clicks"] = clicks
                          save()
                  out["clicks"] = clicks
                  save()

                  # Decoration last, and never fatal.
                  try:
                      page.screenshot(path="out/page.png", full_page=False, timeout=20000)
                  except Exception as e:
                      out["notes"].append(f"screenshot skipped: {type(e).__name__}")
                      save()
                  b.close()
          except Exception as e:
              out["notes"].append(f"fatal: {type(e).__name__}: {e}")
              save()

          save()
          print(f"buttons={out.get('buttons_seen')} clicks={out.get('clicks')} "
                f"captured={len(out['items'])} verdict={out['verdict']}")
          PY
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("out/prompts.json"):
              print("## prompt-grab — no result file"); raise SystemExit
          d = json.load(open("out/prompts.json", encoding="utf-8"))
          print(f"## prompt-grab — `{d['url']}`\n")
          print(f"buttons seen: **{d.get('buttons_seen')}** · clicked: **{d.get('clicks')}** · "
                f"captured: **{len(d['items'])}** · verdict: **{d.get('verdict')}**\n")
          if d["items"]:
              print("| card | prompt (first 120 chars) |")
              print("|---|---|")
              for it in d["items"][:25]:
                  p = it["prompt"].replace("|", "\\|").replace("\n", " ")[:120]
                  print(f"| {it['label'][:40]} | {p} |")
          for n in d.get("notes", [])[:10]:
              print(f"\n- note: {n}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "prompt-grab-${{ github.run_id }}"
          path: out/
          retention-days: 7
