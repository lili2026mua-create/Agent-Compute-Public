# Screenshot an HTML file from this repo in real headless Chromium (Playwright).
# Purpose: design previews with modern CSS (backdrop-filter, blur, variable fonts)
# that the chat-local wkhtmltoimage (legacy WebKit) cannot render.
# Boundary (measured 1405-05-29 on render.yml): headless Chromium here has no WebGL.
name: design-shot
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path of an HTML file inside this repo (e.g. previews/nav.html)"
        required: false
        default: ""
      url:
        description: "OR: a public http(s) URL to open instead of a repo file"
        required: false
        default: ""
      scroll:
        description: "Scroll-to-bottom passes before the shot"
        required: false
        default: "0" 
      width:
        description: "Viewport width in px"
        required: false
        default: "1220"
      wait_ms:
        description: "Extra wait before the shot (ms)"
        required: false
        default: "1500"
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Shot
        env:
          P: ${{ inputs.path }}
          U: ${{ inputs.url }}
          W: ${{ inputs.width }}
          MS: ${{ inputs.wait_ms }}
          SC: ${{ inputs.scroll }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          url = os.environ.get("U", "").strip()
          path = os.environ.get("P", "").strip()
          target = url if url else ("file://" + os.path.abspath(path))
          width = int(os.environ["W"]); wait = int(os.environ["MS"])
          scroll = int(os.environ.get("SC", "0"))
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              page = b.new_page(viewport={"width": width, "height": 900},
                                device_scale_factor=2)
              page.goto(target, wait_until="domcontentloaded", timeout=60000)
              try:
                  page.wait_for_load_state("networkidle", timeout=20000)
              except Exception:
                  pass
              for _ in range(scroll):
                  page.mouse.wheel(0, 2200)
                  page.wait_for_timeout(1600)
              page.wait_for_timeout(wait)
              page.screenshot(path="out/shot.png", full_page=True)
              b.close()
          print("shot ok:", target)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-shot
          path: out/
      # The chat egress proxy cannot reach the artifact storage domain (403),
      # so the shot is also committed into the repo where api.github.com serves it.
      - name: Commit shot back
        run: |
          mkdir -p previews/out
          cp out/shot.png "previews/out/shot-${GITHUB_RUN_ID}.png"
          git config user.name  "design-shot"
          git config user.email "design-shot@users.noreply.github.com"
          git add previews/out
          git commit -m "design-shot: run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
