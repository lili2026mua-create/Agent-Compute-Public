# Multi-page crawl. Standard library only - no dependency install step.
name: harvest
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Start URL. Several URLs may be given, one per line or comma separated - they run in one job so the whole round stays on this public repo."
        required: true
      depth:
        description: "Link depth"
        required: false
        default: "2"
      max_pages:
        description: "Page cap"
        required: false
        default: "100"
      include_pat:
        description: "Regex a URL must match to be queued"
        required: false
        default: ""
      delay:
        description: "Seconds between requests to a host"
        required: false
        default: "1.0"
      min_chars:
        description: "Below this many chars a page counts as an empty shell"
        required: false
        default: "500"
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Crawl
        env:
          URL: ${{ inputs.url }}
          DEPTH: ${{ inputs.depth }}
          MAX_PAGES: ${{ inputs.max_pages }}
          INCLUDE_PAT: ${{ inputs.include_pat }}
          DELAY: ${{ inputs.delay }}
          MIN_CHARS: ${{ inputs.min_chars }}
        run: |
          set -u
          mkdir -p out out/parts
          # One job, many seeds. The private consumer repo used to loop and wait,
          # which burned its own (billable) minutes for 40 minutes a round while
          # doing nothing but polling. Looping here keeps every crawl minute on
          # this public repo, where minutes are free.
          i=0
          printf '%s' "$URL" | tr ',' '\n' | while IFS= read -r u; do
            u="$(printf '%s' "$u" | tr -d '\r' | sed 's/^ *//; s/ *$//')"
            [ -z "$u" ] && continue
            i=$((i+1))
            echo "== seed $i: $u"
            args=( "$u" --out "out/parts/part-$i.json" --depth "$DEPTH"
                   --max-pages "$MAX_PAGES" --delay "$DELAY" --min-chars "$MIN_CHARS" )
            [ -n "$INCLUDE_PAT" ] && args+=( --include-pat "$INCLUDE_PAT" )
            # A failed seed is a result, not a broken job.
            python3 Sys.scripts/site_crawl.py "${args[@]}" 2>&1 | tee -a out/log.txt || true
          done
          # Merge every part into one result.json so the consumer stays unchanged.
          python3 - <<'PY' | tee -a out/log.txt
          import glob, json
          pages, roots, failed = [], [], []
          for f in sorted(glob.glob("out/parts/*.json")):
              try:
                  d = json.load(open(f, encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              pages += d.get("pages") or []
              failed += d.get("failed") or []
              if d.get("root"):
                  roots.append(d["root"])
          doc = {"root": roots[0] if roots else None, "roots": roots,
                 "pages": pages, "failed": failed,
                 "summary": {"seeds": len(roots), "ok": len(pages),
                             "failed": len(failed),
                             "text_chars_total": sum(len(p.get("text") or "")
                                                     for p in pages)}}
          json.dump(doc, open("out/result.json", "w", encoding="utf-8"),
                    ensure_ascii=False)
          print(f"merged {len(roots)} seeds -> {len(pages)} pages")
          PY
      - name: Summary
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "out/result.json"
          if not os.path.exists(p):
              print("## No output produced"); raise SystemExit
          d = json.load(open(p, encoding="utf-8")); s = d["summary"]
          print(f"## Harvest of {d.get('root')}\n")
          print(f"- seeds **{s.get('seeds', 1)}** - ok **{s.get('ok')}** - "
                f"failed **{s.get('failed')}** - text **{s.get('text_chars_total')}** chars")
          if d["failed"]:
              print("\n### Failed pages\n")
              for f in d["failed"][:25]:
                  print(f"- `{f['url']}` - {f['reason']}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "harvest-${{ github.run_id }}"
          path: out/
          retention-days: 7